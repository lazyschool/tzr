    <rect width="330" height="34" rx="18" fill="#eef1f6"/>
    <rect y="18" width="330" height="16" fill="#eef1f6"/>
    <circle cx="20" cy="17" r="4" fill="#0f6ccc"/><circle cx="34" cy="17" r="4" fill="#c9d3e0"/><circle cx="48" cy="17" r="4" fill="#c9d3e0"/>
    <g transform="translate(20 52)">
      <rect width="90" height="48" rx="9" fill="#eef1f6" stroke="#e3e8ef"/>
      <rect x="10" y="10" width="46" height="10" rx="5" fill="#0f6ccc"/>
      <rect x="10" y="28" width="60" height="7" rx="3.5" fill="#c9d3e0"/>
      <rect x="100" width="90" height="48" rx="9" fill="#eef1f6" stroke="#e3e8ef"/>
      <rect x="110" y="10" width="46" height="10" rx="5" fill="#0f6ccc"/>
      <rect x="110" y="28" width="48" height="7" rx="3.5" fill="#c9d3e0"/>
      <rect x="200" width="90" height="48" rx="9" fill="#eef1f6" stroke="#e3e8ef"/>
      <rect x="210" y="10" width="46" height="10" rx="5" fill="#0f6ccc"/>
      <rect x="210" y="28" width="66" height="7" rx="3.5" fill="#c9d3e0"/>
    </g>
    <g transform="translate(20 116)" fill="#e3f0fd" stroke="#0f6ccc" stroke-width="2.5">
      <rect x="0" y="52" width="32" height="46" rx="4"/>
      <rect x="44" y="30" width="32" height="68" rx="4"/>
      <rect x="88" y="44" width="32" height="54" rx="4"/>
      <rect x="132" y="12" width="32" height="86" rx="4"/>
      <rect x="176" y="34" width="32" height="64" rx="4"/>
      <rect x="220" y="4" width="32" height="94" rx="4"/>
      <rect x="258" y="26" width="32" height="72" rx="4"/>
    </g>
  </g>

  <!-- hand-drawn founder -->
  <g transform="translate(640 300) scale(1.05)" fill="none" stroke="#0b1220" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 300c0-40 10-64 36-74 10-4 26-5 38-2 26 7 38 33 38 76"/>
    <path d="M71 226c7 10 14 15 22 15s16-5 23-16"/>
    <path d="M118 236c19-5 33-15 38-29"/>
    <path d="M96 80c28 0 45 19 45 48 0 34-19 53-45 53s-45-19-45-53c0-29 17-48 45-48Z"/>
    <path d="M52 109c3-22 18-37 44-37s39 13 44 36c-9-8-19-12-29-11-8 1-12 5-21 5-11 0-17-8-27-4-4 2-8 6-11 11Z"/>
    <rect x="61" y="122" width="30" height="23" rx="8"/>
    <rect x="104" y="122" width="30" height="23" rx="8"/>
    <path d="M91 132c4-3 9-3 13 0"/>
    <path d="M72 133h5M117 133h5" stroke-width="9"/>
