<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="g1" cx="0.92" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#0f6ccc" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0f6ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.02" cy="1" r="0.55">
      <stop offset="0" stop-color="#0f6ccc" stop-opacity=".14"/>
      <stop offset="1" stop-color="#0f6ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3f5"/>
      <stop offset="1" stop-color="#0f6ccc"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#c9d3e0"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="#f7f8fb"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#dotmask)"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- brand -->
  <g transform="translate(84 84)">
    <rect width="44" height="44" rx="12" fill="url(#mark)"/>
    <path d="M12 15h20M22 15v18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="30" font-size="26" font-weight="700" letter-spacing="-1" fill="#0b1220">Tavzuran</text>
  </g>

  <!-- headline -->
  <text x="84" y="268" font-size="92" font-weight="800" fill="#0b1220" letter-spacing="-4">Have an idea?</text>
  <text x="84" y="368" font-size="92" font-weight="800" fill="#0b1220" letter-spacing="-4">We&#8217;ll build it.</text>
  <path d="M320 388c96-18 210-22 322-10" fill="none" stroke="#4da3f5" stroke-width="9" stroke-linecap="round"/>

  <!-- sub -->
  <text x="84" y="446" font-size="28" fill="#5b6b80">Apps, websites &amp; software built for your business.</text>

  <!-- price pill -->
  <g transform="translate(84 490)">
    <rect width="382" height="62" rx="31" fill="#e3f0fd" stroke="#0f6ccc" stroke-opacity=".35" stroke-width="2"/>
    <text x="30" y="40" font-size="25" font-weight="600" fill="#0f6ccc">MVPs starting at &#8377;20,000*</text>
  </g>

